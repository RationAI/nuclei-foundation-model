[project]
name = "nfm"
version = "0.1.0"
authors = [{ name = "Matěj Pekár", email = "matejpekar@mail.muni.cz" }]
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.9.0",
    "pytorch-triton-rocm>=3.5.0 ; sys_platform == 'linux'",
    "lightning>=2.4.0",
    "torchmetrics>=1.4.1",
    "rationai-mlkit>=0.2.0",
    "psutil>=7.0.0",
    "albumentations>=2.0.5",
    "timm>=1.0.15",
    "einops>=0.8.1",
    "transformers>=4.53.0",
    "deepspeed>=0.17.2",
    "shapely>=2.1.1",
    "degraph",
    "mlflow<3.0",
    "ratiopath>=1.0.1",
]


[tool.uv.sources]
torch = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
pytorch-triton-rocm = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
rationai-mlkit = { git = "https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/mlkit.git" }
degraph = { path = "lib/degraph" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true
