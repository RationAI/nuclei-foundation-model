[project]
name = "nfm"
version = "0.1.0"
authors = [{ name = "Matěj Pekár", email = "matejpekar@mail.muni.cz" }]
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.9.0",
    "lightning>=2.4.0",
    "torchmetrics>=1.4.1",
    "rationai-mlkit>=0.2.0",
    "psutil>=7.0.0",
    "einops>=0.8.1",
    "deepspeed>=0.17.2",
    "degraph",
    "ratiopath>=1.0.1",
    "pandas>=2.3.3",
    "lejepa",
    "torchvision>=0.24.1",
    "pylance>=6.0.1",
    "transformers>=5.20.2",
    "nvidia-ml-py>=13.615.71",
]

[dependency-groups]
dev = ["ruff"]
job = ["rationai-kube-jobs"]

[tool.uv.sources]
rationai-mlkit = { git = "https://github.com/RationAI/mlkit.git" }
degraph = { path = "lib/degraph" }
lejepa = { git = "https://github.com/rbalestr-lab/lejepa.git" }
rationai-kube-jobs = { git = "ssh://git@gitlab.ics.muni.cz/rationai/infrastructure/kube-jobs" }
