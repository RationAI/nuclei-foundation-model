[project]
name = "nfm"
version = "0.1.0"
authors = [{ name = "Matěj Pekár", email = "matejpekar@mail.muni.cz" }]
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.9.0",
    "torchvision>=0.24.1",
    "lightning>=2.4.0",
    "torchmetrics>=1.4.1",
    "rationai-mlkit>=0.2.0",
    "timm>=1.0.0",
    "opencv-python-headless>=4.10.0",
    "pylance>=6.0.1",
    "pandas>=2.3.3",
    "scikit-learn>=1.5.0",
    "psutil>=7.0.0",
    "nvidia-ml-py>=13.615.71",
]

[dependency-groups]
dev = ["ruff"]
job = ["rationai-kube-jobs"]

[tool.uv.sources]
rationai-mlkit = { git = "https://github.com/RationAI/mlkit.git" }
rationai-kube-jobs = { git = "ssh://git@gitlab.ics.muni.cz/rationai/infrastructure/kube-jobs" }
