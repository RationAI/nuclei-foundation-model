[project]
name = "nfm"
version = "0.1.0"
authors = [{ name = "Matěj Pekár", email = "matejpekar@mail.muni.cz" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.5.1",
    "lightning>=2.4.0",
    "torchmetrics>=1.4.1",
    "rationai-mlkit>=0.2.0",
    "psutil>=7.0.0",
    "pynvml>=12.0.0",
    "torch-geometric>=2.6.1",
    "histopath>=0.1.0",
    "albumentations>=2.0.5",
    "timm>=1.0.15",
    "einops>=0.8.1",
    "transformers>=4.53.0",
    "deepspeed>=0.17.2",
    "shapely>=2.1.1",
]

[tool.uv]
dev-dependencies = ["mypy", "pre-commit", "ruff"]

[tool.uv.sources]
rationai-mlkit = { git = "https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/mlkit.git" }
histopath = { git = "https://github.com/RationAI/histopath.git", branch = "tiling" }
