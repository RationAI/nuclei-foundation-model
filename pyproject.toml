[project]
name = "nfm"
version = "0.1.0"
authors = [{ name = "Matěj Pekár", email = "matejpekar@mail.muni.cz" }]
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.9.0",
    "lightning>=2.4.0",
    "torchmetrics>=1.4.1",
    "rationai-mlkit>=0.2.0",
    "psutil>=7.0.0",
    "einops>=0.8.1",
    "transformers<5.0.0",
    "deepspeed>=0.17.2",
    "degraph",
    "ratiopath>=1.0.1",
    "pandas>=2.3.3",
    "lejepa",
    "torchvision>=0.24.1",
]

[dependency-groups]
dev = ["mypy", "ruff"]
job = ["rationai-kube-jobs"]

[tool.uv.sources]
rationai-mlkit = { git = "https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/mlkit.git", rev = "549f5be72a162e7debf3a911ea4649f50080b1d0" }
degraph = { path = "lib/degraph" }
lejepa = { git = "https://github.com/rbalestr-lab/lejepa.git" }
rationai-kube-jobs = { git = "ssh://git@gitlab.ics.muni.cz/rationai/infrastructure/kube-jobs" }
