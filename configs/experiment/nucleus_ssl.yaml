# @package _global_
# Unified entry point: uv run python -m nfm +experiment=nucleus_ssl
mode: fit

metadata:
  run_name: Nucleus correspondence SSL
  description: Overlapping graph crops, continuous detached probe, whole-slide validation

model:
  lr: 0.0003
  warmup_steps: 500
  efd_order: ${data.datasets.unlabeled.dataset.efd_order}

trainer:
  max_steps: 100000
  max_epochs: -1
  gradient_clip_val: 1.0
  val_check_interval: 1000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  callbacks:
    model_checkpoint:
      every_n_epochs: null
      every_n_train_steps: 1000
      monitor: validation/AUPRC
      mode: max

data:
  block_size: 128
  k: 16
  datasets:
    unlabeled:
      slides_path: ${project_path}/train_all_mpp_corrected.parquet
      batch_size: 16
      num_workers: 40
      dataset:
        _target_: nfm.data.datasets.NucleiDataset
        nuclei_path: ${project_path}/cells
        crop_size: 4096
        alpha: 0.85
        efd_order: 16
    labeled:
      slides_path: mlflow-artifacts:/37/5b9c6f096026425fa2b04c4e74b7a6f3/artifacts/panda/slides_mapping_train.parquet
      split_size: 0.2
      split_stratify_col: gleason_score
      batch_size: 4
      num_workers: 10
      eval_num_workers: 10
      sampler:
        _target_: nfm.data.samplers.AutoWeightedRandomSampler
        positivity_thr: 0.05
        replacement: true
        pos_slide_ratio: 0.75
      dataset:
        _target_: nfm.data.datasets.ClassificationNucleiDataset
        annotation_path: /mnt/projects/nuclei_based_wsi_analysis/nuclei_supervision/PANDA/Radboud/annotation
        crop_size: 4096
        alpha: 0.8
        efd_order: ${data.datasets.unlabeled.dataset.efd_order}
