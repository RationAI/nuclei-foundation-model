# @package _global_

mode: fit

metadata:
  run_name: "Radboud, k=12: EFD + RoVE + k-NN Attn"

trainer:
  max_epochs: 600
  log_every_n_steps: 5
  accumulate_grad_batches: 1
  gradient_clip_val: 0.7

data:
  block_size: 128
  k: 24
  datasets:
    labeled:
      slides_path: mlflow-artifacts:/37/5b9c6f096026425fa2b04c4e74b7a6f3/artifacts/panda/slides_mapping_train.parquet
      split_size: 0.2
      split_stratify_col: gleason_score
      batch_size: 32
      num_workers: 16
      eval_num_workers: 8
      sampler:
        _target_: nfm.data.samplers.AutoWeightedRandomSampler
        positivity_thr: 0.05
        replacement: true
        pos_slide_ratio: 0.75
      dataset:
        _target_: nfm.data.datasets.ClassificationNucleiDataset
        annotation_path: /mnt/projects/nuclei_based_wsi_analysis/nuclei_supervision/PANDA/Radboud/annotation
        crop_size: 4096
        alpha: 0.8
        efd_order: 16

model:
  lr: 0.0001
  dim: 256
  hidden_dim: 1024
  num_heads: 8
  num_layers: 8
  efd_order: ${data.datasets.labeled.dataset.efd_order}
