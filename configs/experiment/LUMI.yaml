# @package _global_

data:
  batch_size:
    train: 6
    train_labeled: 4
  num_workers:
    train: 4
    train_labeled: 2
  block_size: 128
  k: 16
  train:
    _target_: nfm.data.datasets.NucleiDataset
    slides_path: /flash/project_465002057/nuclei/train_cropped_dedup.parquet
    nuclei_path: /flash/project_465002057/nuclei/cells
  train_labeled:
    _target_: nfm.data.datasets.ClassificationNucleiDataset
    slides_path: /flash/project_465002057/nuclei/labeled_nuclei/slide_metadata.parquet
    nuclei_path: /flash/project_465002057/nuclei/labeled_nuclei/labels

trainer:
  strategy:
    _target_: lightning.pytorch.strategies.FSDPStrategy
    sharding_strategy: SHARD_GRAD_OP

metadata:
  run_name: Training
  description: Training of the model on full data
