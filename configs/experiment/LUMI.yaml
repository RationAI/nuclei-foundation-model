# @package _global_

data:
  block_size: 128
  k: 16
  datasets:
    unlabeled:
      slides_path: /flash/project_465002057/nuclei/train_all_mpp_corrected.parquet
      batch_size: 8
      num_workers: 4
      sampler:
        _target_: nfm.data.samplers.SourceBalancedRandomSampler
      dataset:
        _target_: nfm.data.datasets.NucleiDataset
        nuclei_path: /flash/project_465002057/nuclei/cells
        crop_size: 4096
        augmentation:
          _target_: nfm.data.augmentations.Compose
          augmentations:
            - _target_: nfm.data.augmentations.Flip
            - _target_: nfm.data.augmentations.PositionJitter
              max_shift: 5.0
            - _target_: nfm.data.augmentations.FieldRotation
              max_angle: 3.14
            - _target_: nfm.data.augmentations.NucleiRotation
              max_angle: 0.785 # pi/4
            - _target_: nfm.data.augmentations.FieldScale
              scale_range:
                - 0.9
                - 1.1
            - _target_: nfm.data.augmentations.PolygonScale
              scale_range:
                - 0.85
                - 1.15
            - _target_: nfm.data.augmentations.ShapeDistortion
              noise_std: 0.2
              smoothness: 2
            - _target_: nfm.data.augmentations.AffineSkew
              skew_range:
                - -0.05
                - 0.05
            - _target_: nfm.data.augmentations.RandomDrop
              p: 0.05
            - _target_: nfm.data.augmentations.ClusterDrop
              p: 0.05

    labeled:
      slides_path: /flash/project_465002057/nuclei/labeled_nuclei/slide_metadata.parquet
      split_size: 0.1
      split_stratify_col: gleason_score
      batch_size: 4
      num_workers: 6
      eval_num_workers: 2
      sampler:
        _target_: nfm.data.samplers.AutoWeightedRandomSampler
      dataset:
        _target_: nfm.data.datasets.ClassificationNucleiDataset
        annotation_path: /flash/project_465002057/nuclei/labeled_nuclei/labels
        crop_size: 4096

trainer:
  strategy:
    _target_: lightning.pytorch.strategies.FSDPStrategy
    sharding_strategy: SHARD_GRAD_OP

metadata:
  run_name: Training
  description: Training of the model on full data
