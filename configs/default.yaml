defaults:
  - hydra: default
  - logger: mlflow
  - _self_

seed: 0
mode: ???
checkpoint: null

trainer:
  max_epochs: 100
  precision: 32-true
  gradient_clip_val: 0.1
  callbacks:
    model_checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      save_top_k: 3
      save_last: true
      monitor: train/total_loss
      mode: min

model:
  ema_momentum: 0.999
  dino:
    num_prototypes: 65536
    bottleneck_dim: 256
    num_layers: 3
    hidden_dim: 2048
  ibot:
    num_prototypes: 65536
    bottleneck_dim: 256
    num_layers: 3
    hidden_dim: 2048

metadata:
  run_name: ???
  description: ???
  hyperparams: {}
