# @package data.datasets.unlabeled.dataset.augmentation
# Each view is zoomed, and its nuclei are reshaped, rotated, stretched and
# dropped independently, so views cannot be matched by their exact nuclei.
_target_: nfm.data.augmentations.Compose
transforms:
  - _target_: nfm.data.augmentations.Affine
    rotation: true
    flip: true
    scale: [0.8, 1.25]
  - _target_: nfm.data.augmentations.Drop
    p: 0.15
  - _target_: nfm.data.augmentations.Holes
    count: [1, 8]
    size: [16.0, 64.0] # um
    p: 0.5
  - _target_: nfm.data.augmentations.NucleusAffine
    rotation: 15.0 # degrees
    scale: [0.9, 1.1] # along and across a random axis
  - _target_: nfm.data.augmentations.ShapeNoise
    std: 0.05
    harmonics: 4
    p: 1.0
