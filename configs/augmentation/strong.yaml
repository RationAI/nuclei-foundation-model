# @package data.augmentation
# Each training tile is zoomed, and its nuclei are reshaped, rescaled and
# dropped independently, as the views of the self-supervised model.
_target_: nfm.data.augmentations.Compose
transforms:
  - _target_: nfm.data.augmentations.Affine
    rotation: true
    flip: true
    scale: [0.8, 1.25]
  - _target_: nfm.data.augmentations.Drop
    p: 0.15
  - _target_: nfm.data.augmentations.Holes
    count: [1, 8]
    size: [6.4, 19.2] # (0.05, 0.15) * field
    p: 0.5
  - _target_: nfm.data.augmentations.ShapeNoise
    std: 0.05
    harmonics: 4
    scale: [0.9, 1.1]
    p: 1.0
