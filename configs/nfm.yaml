defaults:
  - base
  - _self_

seed: 0
mode: ???
checkpoint: null

trainer:
  max_epochs: 100
  sync_batchnorm: true
  log_every_n_steps: 10
  precision: 32-true
  gradient_clip_val: 0.1
  callbacks:
    model_checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      save_top_k: 3
      save_last: true
      monitor: train/lejepa_loss
      mode: min
    swa:
      _target_: lightning.pytorch.callbacks.StochasticWeightAveraging
      swa_lrs: 0.05
      swa_epoch_start: 10

model:
  warmup_steps: 1000
  lamb: 0.1
