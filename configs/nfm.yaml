defaults:
  - base
  - descriptor: radial
  - augmentation: strong
  - pooling: simpool
  - _self_

seed: 0
mode: ???
checkpoint: null

trainer:
  max_steps: 20000
  max_epochs: -1
  precision: bf16-mixed
  # LeJEPA runs without clipping can collapse abruptly (arXiv:2610.39302, Fig. 7).
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  val_check_interval: 1000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  callbacks:
    model_checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      # Keep every validation checkpoint. A limited top k writes nothing, not even
      # last, unless the metric improves. Without a monitor the MLflow logger
      # deletes all but the newest one.
      save_top_k: -1
      # The MLflow logger uploads after each save and always re-uploads last, so
      # last would add two uploads of a copy of the newest checkpoint.
      save_last: false
      monitor: validation/region/probe_loss
      mode: min

model:
  backbone:
    in_features: 64 # rays, or 4 * order for efd
    mlp_embed: true
    dim: 768 # about 100M parameters
    depth: 14
    num_heads: 12
    hidden_dim: 2048
    # Every n-th block keeps only its input for the backward pass: 0 (none) needs
    # about 527 KB of activations per token, 1 about 95 KB for 27 % more time and
    # 2 about 295 KB for 13 %.
    checkpoint_every: 0
    rope_theta: 100.0 # positions are in micrometers
    block_size: 128
  projector_dim: 16
  lamb: 0.02
  lr: 0.0005
  probe_lr: 0.001
  weight_decay: 0.05
  warmup_steps: 1000
  # Cells are clustered from the detached tokens by SLIC, from the farthest point
  # sampling cells of the neighborhoods. A nucleus may join any cell of its view,
  # by a distance that mixes position and token, each scaled by its mean
  # contrast between the neighboring and the own initial cell.
  clustering:
    iterations: 5
    projection_dim: 64 # random projection of the tokens for the distances
  # 0 is spatial only, 0.5 weighs the contrasts alike, 1 tokens only. With
  # trained tokens, 0.5 keeps 92 % of the tracks of 0 and 0.75 keeps 75 %, for
  # purer cells. Random tokens at 0.5 leave a quarter of the tracks.
  cluster_mix: 0.5
  # So the clustering is spatial in the first tenth of the training, and the mix
  # then rises linearly until 30 %.
  cluster_schedule: [0.1, 0.3]
  min_overlap: 0.3 # Jaccard index of the global cells of a track
  min_share: 0.5 # of the nuclei of a local cell, in the global cells of its track

# Neighborhoods of the attention, and the seeds of the cells pooled into regions.
neighborhoods:
  _target_: nfm.data.neighborhoods.Neighborhoods
  neighbors: 16 # a nucleus attends the blocks holding these nearest nuclei
  nuclei_per_cell: 64 # initial cells seeded by farthest point sampling

data:
  block_size: ${model.backbone.block_size}
  datasets:
    unlabeled:
      slides_path: ${project_path}/train_final.parquet
      # Samples of 2 global and 6 local views, about 9.6k tokens after drop and
      # holes, 135k per batch, as many as 16 samples of the former 4 views.
      batch_size: 14
      # A worker builds a batch in about 3 s.
      num_workers: 16
      dataset:
        _target_: nfm.data.datasets.NucleiDataset
        nuclei_path: ${project_path}/cells
        global_views: 2
        global_nuclei: [3072, 4096]
        local_views: 6
        local_nuclei: [512, 1024]
        center_nuclei: 1024 # global view centers among the nuclei closest to the seed
        region_nuclei: 8192
        neighborhoods: ${neighborhoods}
        descriptor: ${descriptor}
    labeled:
      slides_path: mlflow-artifacts:/37/5b9c6f096026425fa2b04c4e74b7a6f3/artifacts/panda/slides_mapping_train.parquet
      split_size: 0.2
      split_stratify_col: gleason_score
      batch_size: 8 # slide crops
      crop_nuclei: 4096
      num_workers: 6
      eval_num_workers: 24 # the training workers are idle during validation
      dataset:
        _target_: nfm.data.datasets.ClassificationNucleiDataset
        annotation_path: /mnt/projects/nuclei_based_wsi_analysis/nuclei_supervision/PANDA/Radboud/annotation
        neighborhoods: ${neighborhoods}
        descriptor: ${descriptor}
