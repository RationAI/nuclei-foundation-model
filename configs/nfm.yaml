defaults:
  - base
  - descriptor: radial
  - augmentation: strong
  - pooling: simpool
  - _self_

seed: 0
mode: ???
checkpoint: null

trainer:
  # Optimizer steps, each over accumulate_grad_batches batches, so 30000 steps
  # of 4 batches see 6 times the samples of the former 20000 steps of one. The
  # learning rate schedule and the warmup count optimizer steps too.
  max_steps: 30000
  max_epochs: -1
  # Averages the gradients of 4 batches of 14 samples. The invariance gradient is
  # that of one batch of 56, but SIGReg is a statistic of each batch, so its pull
  # stays that of a batch of 14, with the noise of a batch of 56. To match a true
  # batch of 56, raise model.lamb to 4 * lamb / (1 - lamb + 4 * lamb) = 0.0755.
  accumulate_grad_batches: 4
  precision: bf16-mixed
  # LeJEPA runs without clipping can collapse abruptly (arXiv:2610.39302, Fig. 7).
  gradient_clip_val: 1.0
  log_every_n_steps: 10 # optimizer steps
  # Counts batches, not optimizer steps: every 1000 optimizer steps of 4 batches.
  val_check_interval: 4000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  callbacks:
    model_checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      # Only the newest checkpoint, overwritten at each validation. Without a
      # monitor, a top k of 1 keeps the latest save, and the name last makes the
      # MLflow logger upload it again each time. save_last would write nothing:
      # it only follows a top k save at the same step.
      filename: last
      save_top_k: 1
      monitor: null
      save_last: false

model:
  backbone:
    in_features: 64 # rays, or 4 * order for efd
    mlp_embed: true
    dim: 768 # about 100M parameters
    depth: 14
    num_heads: 12
    hidden_dim: 2048
    # Every n-th block keeps only its input for the backward pass: 0 (none) needs
    # about 527 KB of activations per token, 1 about 95 KB for 27 % more time and
    # 2 about 295 KB for 13 %.
    checkpoint_every: 0
    rope_theta: 100.0 # positions are in micrometers
    block_size: 128
  projector_dim: 16
  lamb: 0.02
  lr: 0.0005
  probe_lr: 0.001
  weight_decay: 0.05
  warmup_steps: 1000

# Neighborhoods of the attention, and the Voronoi cells pooled into regions.
neighborhoods:
  _target_: nfm.data.neighborhoods.Neighborhoods
  neighbors: 16 # a nucleus attends the blocks holding these nearest nuclei
  nuclei_per_cell: 64 # cell seeds placed by farthest point sampling

data:
  block_size: ${model.backbone.block_size}
  datasets:
    unlabeled:
      slides_path: ${project_path}/train_final.parquet
      # Samples of 2 global and 6 local views, about 9.7k tokens after the drops,
      # merges and false detections, 136k per batch, as many as 16 samples of
      # the former 4 views.
      batch_size: 14
      # A worker builds a batch in about 3 s.
      num_workers: 16
      dataset:
        _target_: nfm.data.datasets.NucleiDataset
        nuclei_path: ${project_path}/cells
        global_views: 2
        global_nuclei: [3072, 4096]
        local_views: 6
        local_nuclei: [512, 1024]
        center_nuclei: 1024 # global view centers among the nuclei closest to the seed
        region_nuclei: 8192
        min_overlap: 0.3 # Jaccard index of the global cells of a track
        min_share: 0.5 # of the nuclei of a local cell, in the global cells of its track
        neighborhoods: ${neighborhoods}
        descriptor: ${descriptor}
    labeled:
      slides_path: mlflow-artifacts:/37/5b9c6f096026425fa2b04c4e74b7a6f3/artifacts/panda/slides_mapping_train.parquet
      split_size: 0.2
      split_stratify_col: gleason_score
      batch_size: 8 # slide crops
      crop_nuclei: 4096
      num_workers: 6
      eval_num_workers: 24 # the training workers are idle during validation
      dataset:
        _target_: nfm.data.datasets.ClassificationNucleiDataset
        annotation_path: /mnt/projects/nuclei_based_wsi_analysis/nuclei_supervision/PANDA/Radboud/annotation
        neighborhoods: ${neighborhoods}
        descriptor: ${descriptor}
