defaults:
  - base
  - descriptor: radial
  - augmentation: strong
  - _self_

seed: 0
mode: ???
checkpoint: null

trainer:
  max_steps: 20000
  max_epochs: -1
  precision: bf16-mixed
  log_every_n_steps: 10
  val_check_interval: 1000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  callbacks:
    model_checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      # Keep every validation checkpoint. A limited top k writes nothing, not even
      # last, unless the metric improves. Without a monitor the MLflow logger
      # deletes all but the newest one.
      save_top_k: -1
      save_last: true
      monitor: validation/tile/probe_loss
      mode: min

model:
  backbone:
    in_features: 64 # rays, or 4 * order for efd
    mlp_embed: true
    dim: 384
    depth: 12
    num_heads: 6
    hidden_dim: 1024
    rope_theta: 100.0 # positions are in micrometers
  lr: 0.0005
  probe_lr: 0.001
  weight_decay: 0.05
  warmup_steps: 1000

field: 128.0 # um, about 30 nuclei per tile

# Radboud only. The split matches the self-supervised model for the same seed.
data:
  slides_path: mlflow-artifacts:/37/5b9c6f096026425fa2b04c4e74b7a6f3/artifacts/panda/slides_mapping_train.parquet
  split_size: 0.2
  split_stratify_col: gleason_score
  split_seed: ${seed}
  tiles_per_slide: 16
  batch_size: 32 # slides, so 512 tiles per step
  num_workers: 32
  eval_num_workers: 8
  dataset:
    _target_: nfm.data.datasets.ClassificationNucleiDataset
    annotation_path: /mnt/projects/nuclei_based_wsi_analysis/nuclei_supervision/PANDA/Radboud/annotation
    field: ${field}
    descriptor: ${descriptor}
