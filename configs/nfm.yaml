defaults:
  - base
  - _self_

seed: 0
mode: ???
checkpoint: null

trainer:
  max_steps: 20000
  max_epochs: -1
  precision: bf16-mixed
  gradient_clip_val: 3.0
  log_every_n_steps: 10
  val_check_interval: 1000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  callbacks:
    model_checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      # Keep every validation checkpoint. A limited top k writes nothing, not even
      # last, unless the metric improves. Without a monitor the MLflow logger
      # deletes all but the newest one.
      save_top_k: -1
      save_last: true
      monitor: validation/tile/probe_loss
      mode: min

model:
  backbone:
    in_features: 64 # 4 * efd_order
    dim: 384
    depth: 12
    num_heads: 6
    hidden_dim: 1024
    rope_theta: 100.0 # positions are in micrometers
  projector_dim: 16
  lamb: 0.02
  ibot_weight: 1.0
  sigreg_tokens: 4096
  lr: 0.0005
  probe_lr: 0.001
  weight_decay: 0.05
  warmup_steps: 1000

efd_order: 16

data:
  mask_probability: 0.5
  mask_ratio: [0.1, 0.5]
  datasets:
    unlabeled:
      slides_path: ${project_path}/train_final.parquet
      batch_size: 128
      num_workers: 40
      dataset:
        _target_: nfm.data.datasets.NucleiDataset
        nuclei_path: ${project_path}/cells
        # Virchow2 recipe at 40x, 20x, 10x and 5x for 224 px views, in micrometers.
        global_views: 2
        local_views: 8
        fields: [56.0, 112.0, 224.0, 448.0]
        field_weights: [0.2, 0.4, 0.2, 0.2]
        context_scale: 1.75 # 392 / 224 px
        local_scale: 0.4375 # 98 / 224 px
        max_global_nuclei: 512
        max_local_nuclei: 128
        max_density: 0.0125
        efd_order: ${efd_order}
        global_augmentation:
          _target_: nfm.data.augmentations.Compose
          transforms:
            - _target_: nfm.data.augmentations.Affine
              rotation: true
              flip: true
              scale: [0.9, 1.1]
            - _target_: nfm.data.augmentations.Drop
              p: 0.1
            - _target_: nfm.data.augmentations.Jitter
              std: 1.0
            - _target_: nfm.data.augmentations.ShapeNoise
              std: 0.03
              harmonics: 4
              scale: [0.9, 1.1]
        local_augmentation: ${.global_augmentation}
    labeled:
      slides_path: mlflow-artifacts:/37/5b9c6f096026425fa2b04c4e74b7a6f3/artifacts/panda/slides_mapping_train.parquet
      split_size: 0.2
      split_stratify_col: gleason_score
      batch_size: 32 # slides, so 512 tiles per step
      tiles_per_slide: 16
      num_workers: 6
      eval_batch_size: 32 # slides, so up to 2048 tiles per step
      eval_tiles_per_slide: 64
      eval_num_workers: 6
      dataset:
        _target_: nfm.data.datasets.ClassificationNucleiDataset
        annotation_path: /mnt/projects/nuclei_based_wsi_analysis/nuclei_supervision/PANDA/Radboud/annotation
        field: 112.0 # 224 px at 20x, as Virchow2 evaluates tile tasks at 20x
        efd_order: ${efd_order}
