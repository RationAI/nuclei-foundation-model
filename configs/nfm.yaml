defaults:
  - base
  - _self_

seed: 0
mode: ???
checkpoint: null

trainer:
  max_steps: 20000
  max_epochs: -1
  precision: bf16-mixed
  gradient_clip_val: 3.0
  log_every_n_steps: 10
  val_check_interval: 1000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  callbacks:
    model_checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      # Keep every validation checkpoint. A limited top k writes nothing, not even
      # last, unless the metric improves. Without a monitor the MLflow logger
      # deletes all but the newest one.
      save_top_k: -1
      save_last: true
      monitor: validation/probe_loss
      mode: min

model:
  backbone: vit_small_patch14_reg4_dinov2
  image_size: ${tile.size}
  embed_dim: 512
  projector_dim: 16
  drop_path_rate: 0.4
  lamb: 0.02
  ibot_weight: 1.0
  mask_ratio: [0.1, 0.5]
  mask_probability: 0.5
  sigreg_patches: 4096
  lr: 0.0005
  probe_lr: 0.001
  weight_decay: 0.05
  warmup_steps: 1000

# Radboud probe tiles at 20x (0.5 um/px), as Virchow2 evaluates tile tasks at 20x.
tile:
  field: 112.0
  size: 224

data:
  datasets:
    unlabeled:
      slides_path: ${project_path}/train_final.parquet
      batch_size: 256
      num_workers: 40
      dataset:
        _target_: nfm.data.datasets.NucleiDataset
        nuclei_path: ${project_path}/cells
        # Virchow2 recipe: 40x, 20x, 10x, 5x and extended-context translation.
        global_views: 2
        local_views: 8
        context_size: 392
        mpps: [0.25, 0.5, 1.0, 2.0]
        mpp_weights: [0.2, 0.4, 0.2, 0.2]
        max_density: 0.0125
        global_augmentation:
          _target_: albumentations.Compose
          _convert_: all
          telemetry: false
          keypoint_params:
            _target_: albumentations.KeypointParams
            coord_format: xy
            remove_invisible: false
          transforms:
            - _target_: albumentations.RandomResizedCrop
              size: [224, 224]
              scale: [0.294, 0.359] # (0.9, 1.1) * (224 / 392)^2
              ratio: [0.95, 1.05]
              p: 1.0
            - _target_: albumentations.HorizontalFlip
              p: 0.5
            - _target_: albumentations.VerticalFlip
              p: 0.5
            - _target_: albumentations.GaussianBlur
              sigma_range: [0.1, 2.0]
              p: 0.5
        local_augmentation:
          _target_: albumentations.Compose
          _convert_: all
          telemetry: false
          transforms:
            - _target_: albumentations.RandomResizedCrop
              size: [98, 98]
              scale: [0.056, 0.069] # (0.9, 1.1) * (98 / 392)^2
              ratio: [0.95, 1.05]
              p: 1.0
            - _target_: albumentations.HorizontalFlip
              p: 0.5
            - _target_: albumentations.VerticalFlip
              p: 0.5
            - _target_: albumentations.GaussianBlur
              sigma_range: [0.1, 2.0]
              p: 0.5
    labeled:
      slides_path: mlflow-artifacts:/37/5b9c6f096026425fa2b04c4e74b7a6f3/artifacts/panda/slides_mapping_train.parquet
      split_size: 0.2
      split_stratify_col: gleason_score
      batch_size: 8 # slides, so 128 tiles per step
      tiles_per_slide: 16
      num_workers: 6
      eval_batch_size: 8 # slides, so up to 512 tiles per step
      eval_tiles_per_slide: 64
      eval_num_workers: 6
      dataset:
        _target_: nfm.data.datasets.ClassificationNucleiDataset
        annotation_path: /mnt/projects/nuclei_based_wsi_analysis/nuclei_supervision/PANDA/Radboud/annotation
        field: ${tile.field}
        size: ${tile.size}
